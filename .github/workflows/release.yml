name: Test and release

# Tests run on every push and pull request. Pushing a version tag (v1.2.3)
# also packages the addon with the BigWigs packager and uploads it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - name: Game logic and fairness tests
        run: lua tests/schmoovin_spec.lua . 6 5

      - name: Hardest zone length (15 s)
        run: lua tests/schmoovin_spec.lua . 4 5 15

      - name: Smoke test (whole addon against stub WoW functions)
        run: lua tests/schmoovin_smoke.lua . "$(grep -E '\.lua' SchmoovinMan.toc | tr -d '\r' | paste -sd,)"

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # CurseForge upload token; without it the zip still goes to the GitHub release.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
